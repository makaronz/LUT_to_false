<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelPasta - Analiza plików LUT</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
</head>
<body>
    <header>
        <div class="container">
            <h1>PixelPasta</h1>
            <p>Narzędzie do analizy plików LUT w formacie .CUBE</p>
        </div>
    </header>

    <main class="container">
        <section class="upload-section">
            <h2>Prześlij plik LUT</h2>
            <div id="file-upload-component-container"></div>
            
            <div class="form-group">
                <label for="color-space">Wybierz przestrzeń barwną kamery:</label>
                <select id="color-space" name="color-space" required>
                    <option value="">-- Wybierz przestrzeń --</option>
                    <option value="S-Gamut3">S-Gamut3/S-Log3</option>
                    <option value="S-Gamut3.Cine">S-Gamut3.Cine/S-Log3</option>
                    <option value="LogC">ARRI LogC</option>
                    <option value="LogC4">ARRI LogC4</option>
                </select>
            </div>
            <button type="button" id="analyze-button" class="btn btn-primary" style="display: none;">Analizuj</button>
        </section>

        <section class="results-section" id="results" style="display: none;">
            <h2>Wyniki analizy</h2>
            
            <div class="tabs" role="tablist" aria-label="Sekcje wyników">
                <button 
                    id="curve-tab-btn"
                    class="tab-btn active" 
                    role="tab"
                    aria-selected="true"
                    aria-controls="curve-tab"
                    tabindex="0"
                    data-tab="curve-tab">
                    <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3 3v18h18V3H3zm16 16H5V5h14v14zM9 9v6h2V9H9zm4 3v3h2v-3h-2z"/>
                    </svg>
                    Krzywa tonalna
                </button>
                <button 
                    id="table-tab-btn"
                    class="tab-btn" 
                    role="tab"
                    aria-selected="false"
                    aria-controls="table-tab"
                    tabindex="-1"
                    data-tab="table-tab">
                    <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3 5v14h18V5H3zm16 2v2H5V7h14zM5 11v2h14v-2H5zm0 4v2h14v-2H5z"/>
                    </svg>
                    Tabela porównawcza
                </button>
                <button 
                    id="info-tab-btn"
                    class="tab-btn" 
                    role="tab"
                    aria-selected="false"
                    aria-controls="info-tab"
                    tabindex="-1"
                    data-tab="info-tab">
                    <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
                    </svg>
                    Informacje o LUT
                </button>
            </div>
            
            <div class="tab-content">
                <div id="curve-tab" class="tab-pane active" role="tabpanel" aria-labelledby="curve-tab-btn">
                    <div class="chart-container">
                        <canvas id="curve-chart"></canvas>
                    </div>
                </div>
                
                <div id="table-tab" class="tab-pane" role="tabpanel" aria-labelledby="table-tab-btn" hidden>
                    <div class="table-container">
                        <table id="comparison-table">
                            <thead>
                                <tr>
                                    <th>Ekspozycja (%)</th>
                                    <th>S-Log3 (%)</th>
                                    <th>Rec.709 (%)</th>
                                    <th>Twój LUT (%)</th>
                                </tr>
                            </thead>
                            <tbody id="table-body">
                                <!-- Dane będą wstawiane dynamicznie -->
                            </tbody>
                        </table>
                        <div id="comparison-table-container"></div>
                    </div>
                </div>
                
                <div id="info-tab" class="tab-pane" role="tabpanel" aria-labelledby="info-tab-btn" hidden>
                    <div class="info-container">
                        <h3>Informacje o pliku LUT</h3>
                        <div id="lut-info">
                            <!-- Informacje będą wstawiane dynamicznie -->
                        </div>
                    </div>
                </div>
            </div>
            
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 PixelPasta. Wszelkie prawa zastrzeżone.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="{{ url_for('static', filename='js/components/FileUpload.js') }}"></script>
    <script src="{{ url_for('static', filename='js/components/ComparisonTable.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
