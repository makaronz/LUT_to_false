{% extends "base.html" %}

{% block title %}Prześlij LUT - Pixel Pasta{% endblock %}

{% block content %}
    <h2>Analizator LUT</h2>
    <p>Witaj w narzędziu Pixel Pasta do analizy plików LUT w formacie .cube.</p>
    <p>Prześlij swój plik LUT i wybierz krzywą referencyjną, aby wygenerować raport porównawczy.</p>

    <form method="post" action="{{ url_for('analyze_lut_route') }}" enctype="multipart/form-data" class="upload-form">
        <div class="form-group">
            <label for="lut_file">Wybierz plik .cube:</label>
            <input type="file" id="lut_file" name="lut_file" accept=".cube" required>
        </div>

        <div class="form-group">
            <label for="curve_select">Wybierz krzywą referencyjną:</label>
            <select name="curve_select" id="curve_select">
                {% for curve in curves %}
                    <option value="{{ curve }}" {% if curve == 'slog3' %}selected{% endif %}>{{ curve.upper() }}</option>
                {% endfor %}
            </select>
        </div>

        <button type="submit" class="btn btn-primary">Analizuj</button>
    </form>
{% endblock %}
