<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>{% block title %}LUTcompareTool{% endblock %}</title>
    <!-- Google Fonts - Press Start 2P -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='images/favicon.ico') }}" type="image/x-icon"> <!-- Placeholder for favicon -->
</head>
<body>
    <header>
        <div class="container">
            <!-- Zakładam, że logo jest w static/images/pixel_pasta_logo.png -->
            <img src="{{ url_for('static', filename='images/pixel_pasta_logo.png') }}" alt="LUTcompareTool Logo" class="logo">
            <h1>LUTcompareTool</h1>
        </div>
    </header>

    <main class="container">
        <!-- Wyświetlanie wiadomości flash -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-messages">
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <!-- Główna zawartość strony -->
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="container">
            <p>&copy; LUTcompareTool. All rights reserved.</p> <!-- Upewniono się, że tag {% now 'Y' %} jest usunięty -->
        </div>
    </footer>

    <!-- Bootstrap JS (opcjonalne, jeśli potrzebujesz interaktywnych komponentów) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Opcjonalne skrypty JS -->
    <!-- <script src="{{ url_for('static', filename='js/main.js') }}"></script> -->
</body>
</html>
